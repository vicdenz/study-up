name: Deploy Vercel

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment environment
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: vercel-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

      - name: Pull Preview configuration
        if: inputs.target == 'preview'
        run: npx --yes vercel@58.4.0 pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Pull Production configuration
        if: inputs.target == 'production'
        run: npx --yes vercel@58.4.0 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Preview artifact
        if: inputs.target == 'preview'
        run: npx --yes vercel@58.4.0 build --token="$VERCEL_TOKEN"
      - name: Build Production artifact
        if: inputs.target == 'production'
        run: npx --yes vercel@58.4.0 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Preview artifact
        if: inputs.target == 'preview'
        run: npx --yes vercel@58.4.0 deploy --prebuilt --token="$VERCEL_TOKEN"
      - name: Deploy Production artifact
        if: inputs.target == 'production'
        run: npx --yes vercel@58.4.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
