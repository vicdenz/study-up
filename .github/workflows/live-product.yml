name: Live product verification

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Vercel preview or production URL
        required: true
        type: string

permissions:
  contents: read

jobs:
  live-product:
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify authenticated CRUD and Gemini
        run: npm run test:e2e:live -- --project=chromium
        env:
          E2E_BASE_URL: ${{ inputs.deployment_url }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
