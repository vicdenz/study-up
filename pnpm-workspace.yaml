packages:
  - "."

engineStrict: true
preferFrozenLockfile: true
savePrefix: ""
strictPeerDependencies: true

overrides:
  brace-expansion: 5.0.12
  postcss-selector-parser@<6.1.5: 6.1.5
  shell-quote@>=1.8.4 <1.11.0: 1.11.0

# Vite's optional WASM fallback currently declares prerelease emnapi peers even
# though its stable runtime resolves these versions. Keep the exception narrow.
peerDependencyRules:
  allowedVersions:
    "@emnapi/core": "1.11.1"
    "@emnapi/runtime": "1.11.1"
